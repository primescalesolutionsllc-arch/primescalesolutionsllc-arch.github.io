{"name": "Deploy site", "on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"deploy": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "mkdir _site && unzip -q PSS_Website.zip -d _site && cd _site && touch .nojekyll && git init -q -b gh-pages && git config user.name pss-bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -qm deploy && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages"}]}}}
